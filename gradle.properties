# Gradle Build Performance Settings

# Enable configuration cache for faster builds (Gradle 9.0+)
# Caches the result of the configuration phase
org.gradle.configuration-cache=true

# Show configuration cache problems as warnings during initial adoption
# Remove this line after verifying no issues
org.gradle.configuration-cache.problems=warn

# Enable parallel execution for multi-module builds
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# JVM arguments for Gradle daemon
# Adjust -Xmx value based on your system memory
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# Enable daemon (default in Gradle 3.0+, but explicit for clarity)
org.gradle.daemon=true

# Configure on demand (incubating feature, already in use)
org.gradle.configureondemand=true
